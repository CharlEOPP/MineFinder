[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minefinder"
version = "0.0.1"
description = "Detect abandoned mines missing from official inventories using USGS 3DEP LiDAR."
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyyaml>=6",
  # Install these two with mamba first (conda-forge), so pip sees them as satisfied
  # and never pulls a pip rasterio wheel with its own copy of GDAL. See decision 0001.
  "rasterio>=1.4",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
raster = ["whitebox", "richdem"]
ml = ["torch", "torchgeo", "segmentation-models-pytorch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
  # rasterio's own internals still use Affine `*`; newer `affine` prefers `@`.
  # Narrow on purpose: only this message, only from rasterio. Our code stays loud.
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning:rasterio",
]
