[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minefinder"
version = "0.0.1"
description = "Detect abandoned mines missing from official inventories using USGS 3DEP LiDAR."
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
raster = ["rasterio>=1.3", "whitebox", "richdem"]
ml = ["torch", "torchgeo", "segmentation-models-pytorch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
